#!/usr/sbin/nft -f
flush ruleset

define wan_if = "wlo1"

table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    oifname $wan_if masquerade
  }
}
# --- Firewall (v4+v6) ---
table inet filter {
  # Traffic into the pi
  chain input {
    type filter hook input priority filter;
    # By default, reject all traffic (unless explicitly accepted below)
    policy drop;

    # Allow loopback and established/related
    iifname "lo" accept
    ct state established,related accept

    # DHCPv4 server on the Pi (clients send from 68 -> 67; often from 0.0.0.0, broadcast)
    iifname "enx00e04c75831d" udp dport 67 accept

    # DNS resolver on the Pi, LAN-only (both UDP and TCP for large replies/DNSSEC)
    iifname "enx00e04c75831d" udp dport 53 accept
    iifname "enx00e04c75831d" tcp dport 53 accept

    # ICMP: allow ping to this host (v4 from LAN)
    ip saddr 192.168.50.0/24 icmp type echo-request accept
  }

  # Traffic being passed by the pi (from outside to a device on the router LAN)
  chain forward {
    type filter hook forward priority filter;
    policy drop;

    # Let replies through
    ct state established,related accept

    # Allow LAN -> WAN
    iifname "enx00e04c75831d" oifname "wlo1" accept
  }  # Traffic leaving the pi
  chain output {
    type filter hook output priority filter;
    policy accept;
  }
}
